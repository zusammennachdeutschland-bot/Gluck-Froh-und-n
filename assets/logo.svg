<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="33.3%" stop-color="#111111"/>
      <stop offset="33.3%" stop-color="#DD0000"/>
      <stop offset="66.6%" stop-color="#DD0000"/>
      <stop offset="66.6%" stop-color="#FFCC00"/>
      <stop offset="100%" stop-color="#FFCC00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="roundedCorners">
      <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedCorners)">
    <!-- German Flag Bands -->
    <rect x="0" y="0" width="1024" height="341.33" fill="#18181b"/>
    <rect x="0" y="341.33" width="1024" height="341.33" fill="#dc2626"/>
    <rect x="0" y="682.66" width="1024" height="341.33" fill="#eab308"/>

    <!-- Subtle texture / shading -->
    <rect x="0" y="0" width="1024" height="1024" fill="black" opacity="0.05"/>

    <!-- Bold Centered AGS Text -->
    <text x="512" y="580" 
          text-anchor="middle" 
          font-family="'Alexandria', 'Plus Jakarta Sans', 'Arial Black', sans-serif" 
          font-weight="900" 
          font-size="290" 
          letter-spacing="2"
          fill="#FFFFFF" 
          filter="url(#shadow)">AGS</text>
  </g>
</svg>