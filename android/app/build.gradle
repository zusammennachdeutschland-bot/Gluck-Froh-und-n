apply plugin: 'com.android.application'

import java.security.KeyStore

// Decode release.keystore from ANDROID_KEYSTORE_BASE64 environment variable if provided
def keystorePathEnv = (System.getenv("ANDROID_KEYSTORE_PATH") ?: "release.keystore").trim()
def keystoreFile = file(keystorePathEnv)
def keystoreB64Env = System.getenv("ANDROID_KEYSTORE_BASE64")
if (!keystoreFile.exists() && keystoreB64Env != null && !keystoreB64Env.trim().isEmpty()) {
    try {
        def cleanedB64 = keystoreB64Env.replaceAll("\\s+", "")
        keystoreFile.bytes = cleanedB64.decodeBase64()
    } catch (Exception e) {
        throw new GradleException("Failed to decode ANDROID_KEYSTORE_BASE64 into keystore file: " + e.message)
    }
}

def releaseStorePassword = (System.getenv("ANDROID_STORE_PASSWORD") ?: project.findProperty("ANDROID_STORE_PASSWORD") ?: "").toString().trim()
def releaseKeyAlias = (System.getenv("ANDROID_KEY_ALIAS") ?: project.findProperty("ANDROID_KEY_ALIAS") ?: "").toString().trim()
def releaseKeyPassword = (System.getenv("ANDROID_KEY_PASSWORD") ?: project.findProperty("ANDROID_KEY_PASSWORD") ?: "").toString().trim()

def isReleaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains("release")
}

def validateReleaseSigningCredentials = {
    if (!keystoreFile.exists() || keystoreFile.length() == 0) {
        throw new GradleException("Release signing failed: Keystore file '${keystoreFile.name}' is missing or empty. Provide ANDROID_KEYSTORE_BASE64 or place '${keystoreFile.name}' in android/app/.")
    }
    if (releaseStorePassword.isEmpty() || releaseKeyAlias.isEmpty() || releaseKeyPassword.isEmpty()) {
        throw new GradleException("Release signing failed: ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD must all be provided and non-empty.")
    }
    try {
        def ks = KeyStore.getInstance(KeyStore.getDefaultType())
        keystoreFile.withInputStream { is ->
            ks.load(is, releaseStorePassword.toCharArray())
        }
        if (!ks.containsAlias(releaseKeyAlias)) {
            throw new GradleException("Release signing failed: Key alias '${releaseKeyAlias}' was not found inside the keystore.")
        }
        def key = ks.getKey(releaseKeyAlias, releaseKeyPassword.toCharArray())
        if (key == null) {
            throw new GradleException("Release signing failed: Could not retrieve private key for alias '${releaseKeyAlias}'.")
        }
    } catch (GradleException ge) {
        throw ge
    } catch (Exception e) {
        throw new GradleException("Release signing validation failed (invalid keystore format, store password, or key password): " + e.getClass().getSimpleName())
    }
}

if (isReleaseTaskRequested) {
    validateReleaseSigningCredentials()
}

android {
    namespace = "com.glueck.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.glueck.teacher"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode (System.getenv("GITHUB_RUN_NUMBER") ? 200 + System.getenv("GITHUB_RUN_NUMBER").toInteger() : 202)
        versionName "1.0.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            storeFile keystoreFile
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing true
            enableV4Signing false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildTypes {
        debug {
            // Using standard default debug signing configuration
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
