name: Generate Android Release Keystore (Mobile Helper)

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Generate PKCS12 Keystore & Base64 File
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_STORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "ERROR: Please set ANDROID_STORE_PASSWORD and ANDROID_KEY_PASSWORD in GitHub Actions Secrets before running this workflow."
            exit 1
          fi

          KEY_ALIAS="${ANDROID_KEY_ALIAS:-glueckrelease}"
          mkdir -p out_keystore

          keytool -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore out_keystore/release.keystore \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass:env ANDROID_STORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            -dname "CN=Glueck Teacher, OU=Mobile, O=Glueck, L=Cairo, ST=Cairo, C=EG" >/dev/null

          keytool -list \
            -keystore out_keystore/release.keystore \
            -alias "$KEY_ALIAS" \
            -storepass:env ANDROID_STORE_PASSWORD >/dev/null

          base64 out_keystore/release.keystore | tr -d ' \n\r\t' > out_keystore/release.keystore.b64
          echo "Keystore and Base64 file generated and verified for alias '${KEY_ALIAS}'."

      - name: Upload Keystore & Base64 Artifact (1-Day Retention)
        uses: actions/upload-artifact@v4
        with:
          name: glueck-release-keystore-bundle
          path: |
            out_keystore/release.keystore
            out_keystore/release.keystore.b64
          retention-days: 1
          if-no-files-found: error
