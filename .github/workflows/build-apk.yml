name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Diagnostic LFS/CRLF Check
        run: ls -la public/logo.png && file public/logo.png && head -c 50 public/logo.png | xxd

      - name: Verify Android Configuration
        run: |
          echo "Verifying Application ID..."
          grep -q "applicationId \"com.glueck.teacher\"" android/app/build.gradle || (echo "ERROR: Missing/Incorrect applicationId" && exit 1)

          echo "Verifying compileSdkVersion is 36..."
          grep -q "compileSdkVersion = 36" android/variables.gradle || (echo "ERROR: compileSdkVersion must be 36 in android/variables.gradle" && exit 1)
          
          echo "Verifying Version Code Auto-Increment..."
          grep -q "GITHUB_RUN_NUMBER" android/app/build.gradle || (echo "ERROR: Missing GITHUB_RUN_NUMBER for versionCode" && exit 1)

          echo "Verifying Strict Release Signing Configuration (No Debug Fallback)..."
          grep -q "signingConfig signingConfigs.release" android/app/build.gradle || (echo "ERROR: Missing strict release signingConfig" && exit 1)
          if grep -q "signingConfigs.release : signingConfigs.debug" android/app/build.gradle; then
            echo "ERROR: Debug signing fallback detected in release buildType!"
            exit 1
          fi
          echo "All verifications passed."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK Environment
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ -d "$SDK_ROOT/cmdline-tools/latest/bin" ]; then
            echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi
          if [ -d "$SDK_ROOT/platform-tools" ]; then
            echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          fi
          echo "Configured Android SDK environment at $SDK_ROOT"

      - name: Install Android SDK Platform 36 & Build-Tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER=""
          if [ -n "$SDK_ROOT" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "ERROR: sdkmanager not found in ANDROID_HOME or PATH"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
          if [ -n "$SDK_ROOT" ] && [ ! -d "$SDK_ROOT/platforms/android-36" ]; then
            echo "ERROR: Android SDK Platform 36 was not installed at $SDK_ROOT/platforms/android-36"
            exit 1
          fi
          echo "Android SDK Platform 36 verified."

      - name: Restore & Verify Release Keystore from Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing_secrets=0
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then echo "ERROR: Missing secret ANDROID_KEYSTORE_BASE64"; missing_secrets=1; fi
          if [ -z "${ANDROID_STORE_PASSWORD:-}" ]; then echo "ERROR: Missing secret ANDROID_STORE_PASSWORD"; missing_secrets=1; fi
          if [ -z "${ANDROID_KEY_ALIAS:-}" ]; then echo "ERROR: Missing secret ANDROID_KEY_ALIAS"; missing_secrets=1; fi
          if [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then echo "ERROR: Missing secret ANDROID_KEY_PASSWORD"; missing_secrets=1; fi
          if [ "$missing_secrets" -ne 0 ]; then
            echo "ERROR: All four Android release signing secrets must be configured in GitHub Actions Secrets."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \n\r\t' | base64 -d > android/app/release.keystore
          if [ ! -s "android/app/release.keystore" ]; then
            echo "ERROR: Release keystore is missing or empty after Base64 decoding!"
            exit 1
          fi

          echo "Verifying keystore integrity, store password, and alias '${ANDROID_KEY_ALIAS}'..."
          keytool -list \
            -keystore android/app/release.keystore \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_STORE_PASSWORD >/dev/null || {
              echo "ERROR: Keystore verification failed! Check ANDROID_STORE_PASSWORD and ANDROID_KEY_ALIAS."
              exit 1
            }

          echo "Verifying private key password for alias '${ANDROID_KEY_ALIAS}'..."
          tmp_verify_ks="$(mktemp -u).p12"
          trap 'rm -f "$tmp_verify_ks"' EXIT
          keytool -importkeystore \
            -srckeystore android/app/release.keystore \
            -srcstorepass:env ANDROID_STORE_PASSWORD \
            -srckeypass:env ANDROID_KEY_PASSWORD \
            -srcalias "$ANDROID_KEY_ALIAS" \
            -destkeystore "$tmp_verify_ks" \
            -deststoretype PKCS12 \
            -deststorepass:env ANDROID_STORE_PASSWORD \
            -destkeypass:env ANDROID_KEY_PASSWORD \
            -noprompt >/dev/null 2>&1 || {
              echo "ERROR: Private key verification failed! Check ANDROID_KEY_PASSWORD for alias '${ANDROID_KEY_ALIAS}'."
              rm -f "$tmp_verify_ks"
              exit 1
            }
          rm -f "$tmp_verify_ks"
          echo "Release keystore, alias, store password, and key password verified successfully."

      - name: Force Clean Stale Build Artifacts
        run: |
          echo "Removing stale dist/ and android web assets..."
          rm -rf dist android/app/src/main/assets/public

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Restore Pristine Binaries (Failsafe)
        run: node scripts/restore_binaries.cjs

      - name: Typecheck & Build Web Application
        run: npm run lint && CI=true npm run build

      - name: Run Automated Regression Tests
        run: npm test

      - name: Verify Web Build Output
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: Web build failed - dist/index.html missing!"
            exit 1
          fi
          echo "Web build successfully verified in dist/."

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Android Asset Sync
        run: |
          if [ ! -f "android/app/src/main/assets/public/index.html" ]; then
            echo "ERROR: Capacitor sync failed - android assets missing!"
            exit 1
          fi
          echo "Android public assets verified."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          validate-wrappers: false

      - name: Ensure Valid Gradle Wrapper
        run: |
          cd android
          mkdir -p gradle/wrapper
          
          if command -v gradle >/dev/null 2>&1; then
            echo "Generating clean Gradle wrapper via system Gradle..."
            gradle wrapper --gradle-version 8.13 --distribution-type bin
          fi

          echo "Ensuring gradle-wrapper.properties..."
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleRelease --stacktrace

      - name: Verify APK Generated & Signed with Release Certificate
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Release APK build failed - output file missing!"
            exit 1
          fi
          CERT_INFO="$(keytool -printcert -jarfile "$APK_PATH" 2>&1 || true)"
          if [ -z "$CERT_INFO" ] || echo "$CERT_INFO" | grep -qi "Not a signed jar"; then
            echo "ERROR: Generated APK is not signed!"
            exit 1
          fi
          if echo "$CERT_INFO" | grep -qi "CN=Android Debug"; then
            echo "ERROR: Generated APK is signed with an Android Debug certificate instead of Release certificate!"
            exit 1
          fi
          echo "Release APK presence and non-debug release signature verified."

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Glueck-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          overwrite: true

      - name: Produce Build Summary
        run: |
          VERSION_CODE=$((200 + ${GITHUB_RUN_NUMBER:-1}))
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          SHA1_FP="$(keytool -printcert -jarfile "$APK_PATH" 2>/dev/null | grep -i "SHA1:" | head -n 1 | awk '{print $2}' || echo 'N/A')"
          SHA256_FP="$(keytool -printcert -jarfile "$APK_PATH" 2>/dev/null | grep -i "SHA256:" | head -n 1 | awk '{print $2}' || echo 'N/A')"
          echo "### 🚀 Android Build Success" >> $GITHUB_STEP_SUMMARY
          echo "- **Application ID:** com.glueck.teacher" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Name:** 2.0" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Code:** ${VERSION_CODE}" >> $GITHUB_STEP_SUMMARY
          echo "- **Signing Status:** Permanent Release Keystore Confirmed" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Signing SHA-1 (for Firebase Android App):** \`${SHA1_FP}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Signing SHA-256 (for Firebase Android App):** \`${SHA256_FP}\`" >> $GITHUB_STEP_SUMMARY
          echo "#### 📦 Generated Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- 📱 **Release APK:** \`android/app/build/outputs/apk/release/app-release.apk\`" >> $GITHUB_STEP_SUMMARY
