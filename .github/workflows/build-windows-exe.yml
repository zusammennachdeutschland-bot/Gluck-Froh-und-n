name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install --force
          npm install @rollup/rollup-win32-x64-msvc --no-save || true

      - name: Build web assets
        run: npm run build

      - name: Build Windows Installer (.exe)
        run: npx electron-builder --win --x64 --publish never
        env:
          USE_HARD_LINKS: "false"
          ELECTRON_BUILDER_COMPRESSION: "maximum"

      - name: Verify EXE Generated
        shell: bash
        run: |
          echo "=== Verifying Windows EXE Artifacts ==="
          ls -lh release/
          if ! compgen -G "release/*.exe" > /dev/null; then
            echo "::error::No .exe file found in release/ directory!"
            exit 1
          fi

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gluck-windows-installer
          path: release/*.exe
          if-no-files-found: error
