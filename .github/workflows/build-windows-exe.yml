name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Electron Binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-win-cache-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-win-cache-

      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Install Wine for Windows cross-compilation
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine64 wine32

      - name: Build web assets
        run: npm run build

      - name: Build Windows Installer (.exe)
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          USE_HARD_LINKS: "false"
          ELECTRON_BUILDER_COMPRESSION: "maximum"

      - name: Verify EXE Generated
        run: |
          echo "=== Verifying Windows EXE Artifacts ==="
          ls -lh release/
          if ! compgen -G "release/*.exe" > /dev/null; then
            echo "::error::No .exe file found in release/ directory!"
            exit 1
          fi

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gluck-windows-installer
          path: release/*.exe
          if-no-files-found: error
