<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <rect width="1000" height="600" fill="#ffffff" />
  <g transform="translate(500, 220)" text-anchor="middle">
    <style>
      .brand-title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 110px;
        fill: #eb5e45;
        font-weight: 900;
        letter-spacing: 5px;
      }
      .brand-title-shadow {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 110px;
        fill: #fcdcd7;
        font-weight: 900;
        letter-spacing: 5px;
      }
      .user-title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 26px;
        fill: #334155;
        font-weight: 700;
        letter-spacing: 2px;
      }
      .phone-title {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 20px;
        fill: #64748b;
        font-weight: 500;
        letter-spacing: 1.5px;
      }
      .divider-line {
        stroke: #eb5e45;
        stroke-opacity: 0.3;
        stroke-width: 4;
        stroke-linecap: round;
      }
    </style>

    <!-- Main Title "GLÜCK" centered -->
    <text x="3" y="63" class="brand-title-shadow">GLÜCK</text>
    <text x="0" y="60" class="brand-title">GLÜCK</text>

    <!-- Minimal Divider -->
    <line x1="-50" y1="115" x2="50" y2="115" class="divider-line" />

    <!-- User Name centered below -->
    <text x="0" y="180" class="user-title">HERR ABDUL-RAHMAN</text>

    <!-- Phone Number subtle below -->
    <text x="0" y="225" class="phone-title">01156435802</text>
  </g>
</svg>
